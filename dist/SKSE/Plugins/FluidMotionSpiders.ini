; FluidMotionSpiders - procedural IK legs and wall/ceiling crawling for frostbite and dwarven spiders.
; Requires FluidMotionNPC (it does nothing without it). Re-read every time you load a save.
; Split out of Fluid Motion: Pathfinding Overhaul (megakuutti, GPL-3.0).
; Log: Documents\My Games\Skyrim Special Edition\SKSE\FluidMotionSpiders.log

[Spider]
; false = no IK legs and no wall crawling (vanilla spiders).
bEnabled = true
; Closest N spiders within fRadius of the player get IK legs; the rest stay vanilla.
iMaxSpiders = 6
fRadius = 2500
; A leg steps when its foot is this far from its home spot (grows with speed up to fStepDistMax).
fStepDist = 20
fStepDistSpeed = 0.07
fStepDistMax = 32
; How far ahead of home a stepping foot lands (fraction of the step distance).
fOvershoot = 0.6
; Foot lift during a step.
fStepHeight = 12
; Step duration tuning (fraction of the stride time at speed / when slow, clamped to [fSwingMin, fSwingMax] s).
fSwingFrac = 0.45
fSwingFracSlow = 0.33
fSwingMin = 0.08
fSwingMax = 0.80
fSwingSlow = 30
fFootSpeed = 0
; Shorter steps when moving sideways (1 = same as forward).
fSideStep = 0.5
; How fast the body follows the ground under the feet (s), and max body tilt.
fBodyTime = 0.10
fMaxTiltDeg = 25
; Blend time (s) between vanilla legs and IK legs.
fFade = 0.15
; Max legs that may start a step in one frame.
iMaxStartsPerFrame = 6
; Re-apply the IK pose if something overwrites it later in the frame.
bRecommit = true

; Omni movement: spiders may strafe and back up instead of only walking forward and turning (the IK legs make
; that look right). It gives the spider races patched copies of their movement types, so it OVERRIDES the
; spider walk/run/turn speeds set by other mods for as long as it is on.
bOmni = true
; Spiders with IK legs never turn faster than this (deg/s), also while FluidMotionNPC routes them.
fMaxTurnDeg = 75
; Strafe / backward speed as a fraction of forward speed (only where the race has none of its own).
fSideSpeed = 0.6
fBackSpeed = 0.5

; Skeleton fit check: the IK is built for the vanilla frostbite and dwarven spider skeletons. A spider whose
; leg pose never comes within fFitMaxDeg (average degrees) of the vanilla rest pose keeps its vanilla legs.
; A SPIDERFIT line is logged when that is still the case after fFitWarnSec seconds.
fFitMaxDeg = 35
fFitWarnSec = 3
; Races that get omni movement: case-insensitive parts of the race editor ID or name.
sRaces = Spider
; Races that are never touched (no IK legs, no crawling, no omni): case-insensitive parts of the race
; editor ID or name, comma separated. Example: sExcludeRaces = FrostbiteSpiderRaceGiant,MyModSpider
sExcludeRaces =
bLog = false

[Crawl]
; Wall / ceiling crawling. Part of the spider feature: a spider in combat whose target is above it, that
; can't make progress, or that can't reach the target on the navmesh climbs walls and ceilings toward it.
; Crawl speed (u/s), acceleration and turn rate.
fSpeed = 230
fAccel = 600
fTurnDeg = 90
; Only for targets within this distance.
fEngage = 2500
; Start when the target is at least this much higher...
fMinRise = 80
; ...or after this many seconds without getting closer.
fStuckSec = 1.5
; Stop this far from the target.
fStopDist = 105
; Surface probing distance and body offset from the surface.
fHover = 30
fStand = 34
; Steepest surface it can go over (0 = floor, 90 = wall, 180 = ceiling).
fMaxAngleDeg = 100
; Crawl speed sideways / backward as a fraction of forward.
fSideFrac = 0.6
fBackFrac = 0.5
; Keeps crawlers apart from other actors.
fSepRadius = 60
; Give up after this many seconds, then wait fCooldown before trying again.
fMaxSeconds = 40
fCooldown = 3
; Crawl up tree trunks too (false = walk around trees, like a real spider chasing you on the ground).
bClimbTrees = false
; Objects with holes in them (cages, cells, sewer grates, gates...) are walked around, not crawled on: their
; collision looks solid in one spot and is open a few inches further. Case-insensitive parts of the model path.
sNoCrawlModels = cage,grate,grating,bars,portcullis,jail,gate,chain
; A crawling spider on a wall or ceiling that gets within this distance (horizontal) of its target drops down
; onto it, so the fight happens on the floor where it can be hit properly. 0 = never drop.
fPounceDist = 200
; After a crawl fails (stuck on a wall, wedged in a corner), the spider climbs down to the floor and won't start
; another crawl from the same spot toward the same target for this many seconds.
fFailWait = 8
bLog = false
